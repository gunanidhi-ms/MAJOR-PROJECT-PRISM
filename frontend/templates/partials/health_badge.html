{% comment %}System health indicator in the header.{% endcomment %}
{% if health.status == "ok" %}
  <div class="hidden items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs font-medium text-emerald-800 sm:flex" title="Ollama: {% if health.ollama_reachable %}online{% else %}offline{% endif %}">
    <span class="relative flex h-2 w-2">
      <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
      <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
    </span>
    System Online
  </div>
{% else %}
  <div class="hidden items-center gap-2 rounded-full border border-rose-200 bg-rose-50 px-3 py-1.5 text-xs font-medium text-rose-800 sm:flex" title="{{ health.error|default:'Backend unreachable' }}">
    <span class="h-2 w-2 rounded-full bg-rose-500"></span>
    Backend Offline
  </div>
{% endif %}
